# `compact` live-check output format: the statistics block plus a deduplicated
# list of findings (message, level, advice type, occurrence count, and the
# distinct signals that triggered it) — the same detail the harness logs, but
# collapsed. It also lists the samples no matcher gave a signal to, grouped by
# their kind and attribute keys with a few of their names, how many samples
# each signal was checked against, and the attribute keys seen on those samples
# (span attributes, metric data-point attributes) per signal, which
# cmd/obi-weaver-coverage compares with each signal's declared attributes.
#
# `unexpected_attribute` for the keys in `ignored_unexpected` is dropped here
# rather than in `.weaver.toml`: weaver attaches that finding to the metric
# data point or span, naming the attribute only in its context, so a
# `finding_filters` entry cannot scope it to an attribute key. The keys are
# attributes OBI copies onto a signal only when a test opts in:
#   - service.name, service.namespace, service.version: resource attributes
#     that `attributes.extra_group_attributes.app` and
#     `OTEL_EBPF_EXTRA_SPAN_RESOURCE_ATTRIBUTES` copy onto metric data points.
#   - deployment.environment.name: set by the workload through
#     OTEL_RESOURCE_ATTRIBUTES and forwarded onto target.info.
#   - exception.message: set by an application on a span OBI relays.
#
# Must be a hidden directory: a
# visible weaver.yaml inside the registry mount is parsed as a registry file
# and rejected.
whitespace_control:
  trim_blocks: true
  lstrip_blocks: true

templates:
  - template: report.json.j2
    filter: >
      ["service.name", "service.namespace", "service.version",
       "deployment.environment.name", "exception.message"] as $ignored_unexpected
      | { statistics: .statistics,
        findings: (
          [ .samples[] | .. | objects | select(has("all_advice")) | .all_advice[]
            | select(. as $f
                | ($f.id != "unexpected_attribute")
                  or (($ignored_unexpected | map(select(. == ($f.context.attribute_key // ""))) | length) == 0)) ]
          | group_by(.message)
          | map({
              message: .[0].message,
              level:   .[0].level,
              type:    .[0].id,
              count:   length,
              signals: ([ .[] | select((.signal_name // "") != "") | "\(.signal_type):\(.signal_name)" ] | unique)
            })
        ),
        unmatched: (
          [ .samples[] | to_entries[]
            | select(.value.live_check_result.match_info.unmatched? == true
                and .value.live_check_result.match_info.signal_expected == true)
            | { sample_type: .key,
                kind:        (.value.kind // ""),
                name:        (.value.name // ""),
                attributes:  ([ .value.attributes[]?.name ] | sort) } ]
          | group_by([.sample_type, .kind, .attributes])
          | map({
              sample_type: .[0].sample_type,
              kind:        .[0].kind,
              attributes:  .[0].attributes,
              count:       length,
              names:       ([ .[].name ] | unique | .[0:5])
            })
        ),
        matched_signals: (
          [ .samples[] | to_entries[] | .value.live_check_result.match_info.signal? | select(. != null) ]
          | group_by(.)
          | map({ key: .[0], value: length })
          | from_entries
        ),
        signal_attributes: (
          [ .samples[] | to_entries[]
            | .value as $sample
            | ($sample.live_check_result.match_info.signal? // null) as $signal
            | select($signal != null)
            | { signal: $signal,
                keys: (if .key == "metric"
                  then [ $sample.data_points[]?.attributes[]?.name ]
                  else [ $sample.attributes[]?.name ] end) } ]
          | group_by(.signal)
          | map({ key: .[0].signal, value: ([ .[].keys[] ] | unique) })
          | from_entries
        ) }
    application_mode: single
    file_name: live_check.json
