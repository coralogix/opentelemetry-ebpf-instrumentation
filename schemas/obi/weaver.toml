# Weaver project config for the OBI semantic-convention registry.
#
# Passed to `weaver registry live-check` via `--config` (see the weaver service
# definitions under internal/test/integration/components/weaver/ and
# internal/test/oats/weaver/). It declares, in one documented place, the
# advisories OBI deliberately accepts so weaver drops them from the live-check
# report before the test harness (internal/test/weavercheck) accounts for the
# rest. This replaces the hand-maintained `IgnoredAdviceMessages` map that used
# to live in Go.
#
# NOTE: `.weaver.toml` is auto-discovered by weaver when it sits at the current
# working directory; this file is named `weaver.toml` (no dot) and wired
# explicitly with `--config` so it is visible in the registry directory and its
# use is obvious at the call site. It only affects `live-check`; `registry
# check` ignores the [live-check] section.

# --- Accepted live-check advisories -------------------------------------------
#
# `illegal_namespace` (violation): the OTel collector-contrib
# `servicegraphconnector` and `spanmetricsconnector` emit bare `server` /
# `client` labels (declared in service_graph.yaml / spanmetrics.yaml / stats.yaml),
# and netolly emits a bare `iface` alongside `iface.direction` (network.yaml).
# Upstream semconv reserves `server.*` / `client.*` / `iface.*` as namespace
# prefixes (`server.address`, `server.port`, `iface.direction`, …), so weaver
# flags a namespace-vs-attribute collision on every metric sample that also
# touches one of those upstream attributes. These emission contracts are fixed
# by the connector conventions and by netolly's backward-compatible network-flow
# shape — they are not negotiable — so we accept the collision.
#
# Scope: `metric` only. OBI's bare `server` / `client` / `iface` keys appear
# exclusively on metrics, so restricting the filter to the metric signal keeps
# an `illegal_namespace` collision on any other signal type surfacing as a real
# failure. This is broader than the old per-message Go allowlist (it drops any
# metric `illegal_namespace`, not just the five known server/client/iface
# messages); weaver's finding filters match on finding id + signal type, not on
# the message string.
[[live-check.finding_filters]]
exclude = ["illegal_namespace"]
signal_type = "metric"
