groups:
  # Kafka, MQTT, NATS, AMQP. Producer / consumer split by operation; the
  # attribute set is the union OBI emits across systems.
  - id: span.obi.messaging.producer
    type: span
    span_kind: producer
    stability: development
    brief: OBI messaging producer span.
    attributes:
      - ref: messaging.system
        requirement_level: required
      - ref: messaging.destination.name
        requirement_level: required
      - ref: messaging.operation.type
        requirement_level:
          conditionally_required: if the operation maps to a semantic-convention operation type
      - ref: messaging.client.id
        requirement_level:
          conditionally_required: if the client identified itself to the broker
      - ref: messaging.destination.partition.id
        requirement_level:
          conditionally_required: if the broker partitions the destination
      - ref: messaging.kafka.offset
        requirement_level:
          conditionally_required: if the broker is Kafka
      - ref: messaging.message.envelope.size
        requirement_level:
          conditionally_required: if the envelope size was observed on the wire
      - ref: server.address
        requirement_level: required
      - ref: server.port
        requirement_level: required
      - ref: service.peer.name
        requirement_level:
          conditionally_required: if the peer service name could be resolved
      - ref: span.metrics.skip
        requirement_level: opt_in
      - ref: network.peer.address
        requirement_level:
          conditionally_required: if the peer socket address was observed
      - ref: network.peer.port
        requirement_level:
          conditionally_required: if and only if `network.peer.address` is set.
      - ref: error.type
        requirement_level:
          conditionally_required: if the operation ended in an error
      - ref: messaging.operation.name
        requirement_level: required
      - ref: aws.sqs.queue.url
        requirement_level: required
      - ref: aws.request_id
        requirement_level: required
      - ref: aws.extended_request_id
        requirement_level: required
      - ref: cloud.region
        requirement_level: required
      - ref: messaging.message.id
        requirement_level:
          conditionally_required: if the broker returned a message id
  - id: span.obi.messaging.consumer
    type: span
    span_kind: consumer
    stability: development
    brief: OBI messaging consumer span.
    attributes:
      - ref: messaging.system
        requirement_level: required
      - ref: messaging.destination.name
        requirement_level: required
      - ref: messaging.operation.type
        requirement_level:
          conditionally_required: if the operation maps to a semantic-convention operation type
      - ref: messaging.client.id
        requirement_level:
          conditionally_required: if the client identified itself to the broker
      - ref: messaging.destination.partition.id
        requirement_level:
          conditionally_required: if the broker partitions the destination
      - ref: messaging.kafka.offset
        requirement_level:
          conditionally_required: if the broker is Kafka
      - ref: messaging.message.envelope.size
        requirement_level:
          conditionally_required: if the envelope size was observed on the wire
      - ref: server.address
        requirement_level: required
      - ref: server.port
        requirement_level: required
      - ref: service.peer.name
        requirement_level:
          conditionally_required: if the peer service name could be resolved
      - ref: span.metrics.skip
        requirement_level: opt_in
      - ref: network.peer.address
        requirement_level:
          conditionally_required: if the peer socket address was observed
      - ref: network.peer.port
        requirement_level:
          conditionally_required: if and only if `network.peer.address` is set.
      - ref: error.type
        requirement_level:
          conditionally_required: if the operation ended in an error
      - ref: messaging.operation.name
        requirement_level: required
      - ref: aws.sqs.queue.url
        requirement_level: required
      - ref: aws.request_id
        requirement_level: required
      - ref: aws.extended_request_id
        requirement_level: required
      - ref: cloud.region
        requirement_level: required
      - ref: messaging.message.id
        requirement_level:
          conditionally_required: if the broker returned a message id
