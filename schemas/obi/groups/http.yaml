# OBI's HTTP telemetry: the body-capture attributes OBI adds on top of upstream
# semconv, its narrowed copies of the upstream HTTP metrics, and its HTTP span
# contract. The metric groups carry the obi.upstream_override annotation so the
# schemacheck drift test pins unit/instrument/stability to upstream.
groups:
  - id: registry.obi.http
    type: attribute_group
    display_name: OBI HTTP Attributes
    brief: >
      HTTP attributes OBI emits that are not part of upstream semconv
      (captured request/response bodies).
    attributes:
      - id: http.request.body.content
        type: string
        stability: development
        brief: >
          Captured HTTP request body content. Only populated when OBI's body
          capture is enabled and subject to OBI's body-extraction rules
          (size limits, content-type filtering, obfuscation).
        note: >
          Tracks the upstream semantic-conventions proposal
          https://github.com/open-telemetry/semantic-conventions/pull/3521
          ("add http.{request,response}.body.content"). Declared in the OBI
          registry until that proposal is merged and released, at which point
          this attribute moves to upstream semconv.
        examples: ['{"user":"alice"}']
      - id: http.response.body.content
        type: string
        stability: development
        brief: >
          Captured HTTP response body content. Only populated when OBI's body
          capture is enabled and subject to OBI's body-extraction rules
          (size limits, content-type filtering, obfuscation).
        note: >
          Tracks the upstream semantic-conventions proposal
          https://github.com/open-telemetry/semantic-conventions/pull/3521
          ("add http.{request,response}.body.content"). Declared in the OBI
          registry until that proposal is merged and released, at which point
          this attribute moves to upstream semconv.
        examples: ['{"status":"ok"}']

  # --- Metrics ----------------------------------------------------------
  - id: metric.obi.http.client.request.body.size
    type: metric
    metric_name: http.client.request.body.size
    annotations:
      obi:
        upstream_override: true
    brief: OBI-emitted http.client.request.body.size
    instrument: histogram
    unit: "By"
    stability: development
    attributes:
      - ref: http.request.method
      - ref: http.response.status_code
      - ref: http.route
      - ref: server.address
      - ref: server.port
      - ref: service.name
      - ref: service.namespace
      - ref: url.path
      - ref: url.scheme
  - id: metric.obi.http.client.request.duration
    type: metric
    metric_name: http.client.request.duration
    annotations:
      obi:
        upstream_override: true
    brief: OBI-emitted http.client.request.duration
    instrument: histogram
    unit: "s"
    stability: stable
    attributes:
      - ref: http.request.method
      - ref: http.response.status_code
      - ref: http.route
      - ref: server.address
      - ref: server.port
      - ref: service.name
      - ref: service.namespace
      - ref: url.path
      - ref: url.scheme
  - id: metric.obi.http.client.response.body.size
    type: metric
    metric_name: http.client.response.body.size
    annotations:
      obi:
        upstream_override: true
    brief: OBI-emitted http.client.response.body.size
    instrument: histogram
    unit: "By"
    stability: development
    attributes:
      - ref: http.request.method
      - ref: http.response.status_code
      - ref: http.route
      - ref: server.address
      - ref: server.port
      - ref: service.name
      - ref: service.namespace
      - ref: url.path
      - ref: url.scheme
  - id: metric.obi.http.server.request.body.size
    type: metric
    metric_name: http.server.request.body.size
    annotations:
      obi:
        upstream_override: true
    brief: OBI-emitted http.server.request.body.size
    instrument: histogram
    unit: "By"
    stability: development
    attributes:
      - ref: client.address
      - ref: http.request.method
      - ref: http.response.status_code
      - ref: http.route
      - ref: server.address
      - ref: server.port
      - ref: service.name
      - ref: service.namespace
      - ref: url.path
      - ref: url.scheme
  - id: metric.obi.http.server.request.duration
    type: metric
    metric_name: http.server.request.duration
    annotations:
      obi:
        upstream_override: true
    brief: OBI-emitted http.server.request.duration
    instrument: histogram
    unit: "s"
    stability: stable
    attributes:
      - ref: client.address
      - ref: http.request.method
      - ref: http.response.status_code
      - ref: http.route
      - ref: server.address
      - ref: server.port
      - ref: service.name
      - ref: service.namespace
      - ref: url.path
      - ref: url.scheme
  - id: metric.obi.http.server.response.body.size
    type: metric
    metric_name: http.server.response.body.size
    annotations:
      obi:
        upstream_override: true
    brief: OBI-emitted http.server.response.body.size
    instrument: histogram
    unit: "By"
    stability: development
    attributes:
      - ref: client.address
      - ref: http.request.method
      - ref: http.response.status_code
      - ref: http.route
      - ref: server.address
      - ref: server.port
      - ref: service.name
      - ref: service.namespace
      - ref: url.path
      - ref: url.scheme

  # --- Spans ------------------------------------------------------------
  # OBI enriches HTTP spans in place with GraphQL, MCP and JSON-RPC payload
  # attributes when it detects those protocols, and with captured request /
  # response bodies when body capture is enabled, so those attributes appear
  # on the HTTP span rather than a dedicated one.
  - id: span.obi.http.server
    type: span
    span_kind: server
    stability: development
    brief: OBI inbound HTTP server span.
    attributes:
      - ref: http.request.method
      - ref: http.response.status_code
      - ref: url.path
      - ref: url.scheme
      - ref: url.query
      - ref: http.route
      - ref: client.address
      - ref: server.address
      - ref: server.port
      - ref: http.request.body.size
      - ref: http.response.body.size
      - ref: http.request.body.content
      - ref: http.response.body.content
      - ref: http.request.header
      - ref: http.response.header
      - ref: span.metrics.skip
      - ref: graphql.operation.name
      - ref: graphql.operation.type
      - ref: graphql.document
      - ref: mcp.method.name
      - ref: mcp.resource.uri
      - ref: mcp.session.id
      - ref: mcp.protocol.version
      - ref: gen_ai.operation.name
      - ref: gen_ai.tool.name
      - ref: gen_ai.tool.type
      - ref: gen_ai.tool.call.arguments
      - ref: gen_ai.tool.call.result
      - ref: gen_ai.prompt.name
      - ref: jsonrpc.request.id
      - ref: jsonrpc.protocol.version
      - ref: rpc.system.name
      - ref: rpc.method
      - ref: rpc.response.status_code

  - id: span.obi.http.client
    type: span
    span_kind: client
    stability: development
    brief: OBI outbound HTTP client span.
    attributes:
      - ref: http.request.method
      - ref: http.response.status_code
      - ref: url.full
      - ref: url.scheme
      - ref: url.query
      - ref: server.address
      - ref: server.port
      - ref: service.peer.name
      - ref: http.request.body.size
      - ref: http.response.body.size
      - ref: http.request.body.content
      - ref: http.response.body.content
      - ref: http.request.header
      - ref: http.response.header
      - ref: span.metrics.skip
