groups:
  - id: metric.obi.rpc.client.call.duration
    type: metric
    metric_name: rpc.client.call.duration
    annotations:
      obi:
        upstream_override: true
    brief: OBI-emitted rpc.client.call.duration
    instrument: histogram
    unit: "s"
    stability: release_candidate
    attributes:
      - ref: rpc.method
        requirement_level:
          conditionally_required: if available.
      - ref: rpc.response.status_code
        requirement_level:
          conditionally_required: if available.
      - ref: rpc.system.name
        requirement_level: required
      - ref: server.address
        requirement_level:
          conditionally_required: If available.

  - id: metric.obi.rpc.server.call.duration
    type: metric
    metric_name: rpc.server.call.duration
    annotations:
      obi:
        upstream_override: true
    brief: OBI-emitted rpc.server.call.duration
    instrument: histogram
    unit: "s"
    stability: release_candidate
    attributes:
      - ref: client.address
        requirement_level: opt_in
      - ref: rpc.method
        requirement_level:
          conditionally_required: if available.
      - ref: rpc.response.status_code
        requirement_level:
          conditionally_required: if available.
      - ref: rpc.system.name
        requirement_level: required
      - ref: server.address
        requirement_level: opt_in
      - ref: server.port
        requirement_level: opt_in
