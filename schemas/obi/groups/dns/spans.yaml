groups:
  - id: span.obi.dns
    type: span
    span_kind: internal
    stability: development
    brief: OBI DNS resolution span.
    attributes:
      - ref: dns.question.name
        requirement_level: opt_in
      - ref: dns.answers
        requirement_level:
          conditionally_required: if the response carried answers
      - ref: client.address
        requirement_level: required
      - ref: server.address
        requirement_level: required
      - ref: server.port
        requirement_level: required
      - ref: span.metrics.skip
        requirement_level: opt_in
      - ref: error.type
        requirement_level:
          conditionally_required: if the operation ended in an error
