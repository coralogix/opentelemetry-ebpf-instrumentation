# OBI's narrowed copies of the upstream CPython runtime metrics
# (semconv model/cpython). service/container metadata is on the meter
# resource, so these groups list only the GC generation data-point
# attribute. The schemacheck drift test pins each one's unit, instrument and
# stability to the upstream metric of the same name.
file_format: definition/2
metrics:
  - name: cpython.gc.collections
    brief: OBI-emitted cpython.gc.collections
    instrument: counter
    unit: "{collection}"
    stability: development
    requirement_level: recommended
    attributes:
      - ref: cpython.gc.generation
        requirement_level: required
  - name: cpython.gc.collected_objects
    brief: OBI-emitted cpython.gc.collected_objects
    instrument: counter
    unit: "{object}"
    stability: development
    requirement_level: recommended
    attributes:
      - ref: cpython.gc.generation
        requirement_level: required
  - name: cpython.gc.uncollectable_objects
    brief: OBI-emitted cpython.gc.uncollectable_objects
    instrument: counter
    unit: "{object}"
    stability: development
    requirement_level: recommended
    attributes:
      - ref: cpython.gc.generation
        requirement_level: required
