# OBI spans that have no dedicated groups-format domain file of their own:
# the DNS span (dns.yaml is a definition/2 override file, which cannot carry
# span groups) and the failed-connect span (no upstream semconv domain).
# Every other OBI span lives in its protocol's domain file (http.yaml, db.yaml,
# rpc.yaml, messaging.yaml, gen_ai.yaml, aws.yaml).
groups:
  - id: span.obi.dns
    type: span
    span_kind: internal
    stability: development
    brief: OBI DNS resolution span.
    attributes:
      - ref: dns.question.name
      - ref: dns.answers
      - ref: client.address
      - ref: server.address
      - ref: server.port
      - ref: span.metrics.skip

  - id: span.obi.failed_connect
    type: span
    span_kind: client
    stability: development
    brief: OBI failed outbound connection span.
    attributes:
      - ref: client.address
      - ref: server.address
      - ref: server.port
      - ref: span.metrics.skip
