# OBI attaches two internal timing children to every request span, named
# "in queue" and "processing". They carry no attributes by design — their
# content is the start and end timestamps — so this group exists to declare
# that OBI emits them, not to measure them.
groups:
  - id: span.obi.subspan
    type: span
    span_kind: internal
    stability: development
    brief: OBI internal timing sub-span ("in queue" or "processing").
    attributes: []
