groups:
  # Overrides `rpc.system.name`: extends the upstream enum with `aws-api`,
  # which OBI reports for AWS SDK calls (S3, SQS, ...) detected on the wire —
  # the value the AWS SDK instrumentation conventions historically used for
  # `rpc.system`, which upstream v1.41 has no `rpc.system.name` member for.
  # Emitters: pkg/appolly/app/request/span_getters.go (attr.RPCSystem) and
  # pkg/export/otel/tracesgen/tracesgen.go.
  #
  # See ../README.md for the override mechanics (x.obi.* group id, full
  # upstream member list, lint allowlist).
  - id: x.obi.rpc
    type: attribute_group
    display_name: OBI RPC Attribute Overrides
    brief: >
      OBI override of `rpc.system.name` extending the upstream enum with the
      RPC systems OBI detects that upstream semconv has no member for.
    attributes:
      - id: rpc.system.name
        brief: 'The Remote Procedure Call (RPC) system.'
        note: >
          The client and server RPC systems may differ for the same RPC interaction.
          For example, a client may use Apache Dubbo or Connect RPC to communicate
          with a server that uses gRPC since both protocols provide compatibility
          with gRPC.
        type:
          members:
            - id: grpc
              value: 'grpc'
              brief: '[gRPC](https://grpc.io/)'
              stability: release_candidate
            - id: dubbo
              value: 'dubbo'
              brief: '[Apache Dubbo](https://dubbo.apache.org/)'
              stability: release_candidate
            - id: connectrpc
              value: 'connectrpc'
              brief: '[Connect RPC](https://connectrpc.com/)'
              stability: development
            - id: jsonrpc
              value: 'jsonrpc'
              brief: '[JSON-RPC](https://www.jsonrpc.org/)'
              stability: development
            # --- OBI extensions (not in upstream semconv v1.41) ---
            - id: aws-api
              value: 'aws-api'
              brief: >
                An AWS service API call detected on the wire (S3, SQS, ...).
                Mirrors the `aws-api` value the AWS SDK instrumentation
                conventions used for the former `rpc.system` attribute.
              stability: development
            - id: onc_rpc
              value: 'onc_rpc'
              brief: >
                ONC/Sun RPC, detected by OBI's SunRPC instrumentation.
              stability: development
        stability: release_candidate

  - id: registry.obi.rpc
    type: attribute_group
    display_name: OBI RPC Attributes
    brief: >
      RPC attributes OBI emits that are not part of upstream semconv.
    attributes:
      - id: onc_rpc.auth.flavor
        type: string
        stability: development
        brief: ONC/Sun RPC authentication flavor observed on the call.
        note: >
          OBI extension attribute, emitted on Sun RPC spans until upstream
          semconv adds an official ONC RPC auth flavor attribute, at which
          point this key will be migrated to the semconv name.
        examples: ["AUTH_NONE", "AUTH_SYS"]

  - id: metric.obi.rpc.client.call.duration
    type: metric
    metric_name: rpc.client.call.duration
    annotations:
      obi:
        upstream_override: true
    brief: OBI-emitted rpc.client.call.duration
    instrument: histogram
    unit: "s"
    stability: release_candidate
    attributes:
      - ref: rpc.method
      - ref: rpc.response.status_code
      - ref: rpc.system.name
      - ref: server.address
      - ref: service.name
      - ref: service.namespace

  - id: metric.obi.rpc.server.call.duration
    type: metric
    metric_name: rpc.server.call.duration
    annotations:
      obi:
        upstream_override: true
    brief: OBI-emitted rpc.server.call.duration
    instrument: histogram
    unit: "s"
    stability: release_candidate
    attributes:
      - ref: client.address
      - ref: rpc.method
      - ref: rpc.response.status_code
      - ref: rpc.system.name
      - ref: server.address
      - ref: server.port
      - ref: service.name
      - ref: service.namespace

  # gRPC and ONC/Sun RPC share one client / server pair (mirroring upstream's
  # generic span.rpc.client / span.rpc.server), discriminated by
  # rpc.system.name. The onc_rpc.* attributes only appear on ONC/Sun RPC spans.
  - id: span.obi.rpc.server
    type: span
    span_kind: server
    stability: development
    brief: OBI inbound RPC server span (gRPC, ONC/Sun RPC).
    attributes:
      - ref: rpc.system.name
      - ref: rpc.method
      - ref: rpc.response.status_code
      - ref: client.address
      - ref: server.address
      - ref: server.port
      - ref: onc_rpc.program.name
      - ref: onc_rpc.procedure.number
      - ref: onc_rpc.procedure.name
      - ref: onc_rpc.version
      - ref: onc_rpc.auth.flavor
      - ref: span.metrics.skip

  - id: span.obi.rpc.client
    type: span
    span_kind: client
    stability: development
    brief: OBI outbound RPC client span (gRPC, ONC/Sun RPC).
    attributes:
      - ref: rpc.system.name
      - ref: rpc.method
      - ref: rpc.response.status_code
      - ref: server.address
      - ref: server.port
      - ref: service.peer.name
      - ref: onc_rpc.program.name
      - ref: onc_rpc.procedure.number
      - ref: onc_rpc.procedure.name
      - ref: onc_rpc.version
      - ref: onc_rpc.auth.flavor
      - ref: span.metrics.skip
