# Resource entities OBI's own detectors populate. OBI's cloud / host / OS
# detectors (pkg/appolly/meta, the upstream contrib EC2 / Azure VM / GCP
# detectors) set host.*, os.*, cloud.* and provider-specific keys such as
# gcp.gce.* on the resource; which specific keys appear depends on the
# environment, so importing the whole upstream entity keeps live-check tolerant
# of the detector's output without --include-unreferenced.
#
# This file declares only attributes OBI itself SETS. Attributes OBI merely
# forwards from the workload (service.version, deployment.environment.name and
# any other OTEL_RESOURCE_ATTRIBUTES / app-emitted keys) are passthrough, not
# part of OBI's contract, and are tolerated by live-check policy (.weaver.toml)
# instead. The always-set resource attributes (service.*, telemetry.*,
# host.name/id, os.type) and the k8s.* / container.* metadata are enumerated on
# the target.info carriers in obi_internal.yaml.
#
# Imports must live in their own definition/2 file: weaver's imports directive
# is file-level and cannot be mixed into a groups-format domain file.
file_format: definition/2

imports:
  entities:
    - host
    - os
    - cloud
    - gcp.gce
