# OBI recognises GenAI calls by inspecting an HTTP client request, and names
# the span by the operation it detected. The operation types are split the way
# upstream splits them, keyed on `gen_ai.operation.name`, so each span type
# declares only the attributes that operation can carry — a single merged type
# would declare the union of every operation's surface and could never be
# fully covered by any one call.
#
# Provider specifics (`openai.*`, `aws.bedrock.*`) stay on the operation types
# as conditional attributes rather than becoming provider span types of their
# own: upstream models those as refinements, and a refinement's attributes are
# not coverage of the general operation.
groups:
  - id: span.obi.gen_ai.inference.client
    type: span
    span_kind: client
    stability: development
    brief: OBI GenAI inference span (chat and text completion).
    attributes:
      - ref: aws.bedrock.guardrail.id
        requirement_level:
          conditionally_required: if the provider is AWS Bedrock and a guardrail was applied
      - ref: error.type
        requirement_level:
          conditionally_required: if the operation ended in an error
      - ref: gen_ai.conversation.id
        requirement_level:
          conditionally_required: when available
      - ref: gen_ai.input.messages
        requirement_level: opt_in
      - ref: gen_ai.metadata
        requirement_level:
          conditionally_required: if the provider returned request metadata
      - ref: gen_ai.operation.name
        requirement_level: required
      - ref: gen_ai.output.messages
        requirement_level: opt_in
      - ref: gen_ai.output.type
        requirement_level:
          conditionally_required: when applicable and if the request includes an output format.
      - ref: gen_ai.prompt.name
        requirement_level:
          conditionally_required: if the request named a prompt template
      - ref: gen_ai.provider.name
        requirement_level: required
      - ref: gen_ai.request.choice.count
        requirement_level:
          conditionally_required: if available, in the request, and !=1
      - ref: gen_ai.request.frequency_penalty
        requirement_level:
          conditionally_required: if the request set it
      - ref: gen_ai.request.max_tokens
        requirement_level:
          conditionally_required: if the request set it
      - ref: gen_ai.request.model
        requirement_level:
          conditionally_required: If available.
      - ref: gen_ai.request.presence_penalty
        requirement_level:
          conditionally_required: if the request set it
      - ref: gen_ai.request.seed
        requirement_level:
          conditionally_required: if applicable and if the request includes a seed
      - ref: gen_ai.request.stop_sequences
        requirement_level:
          conditionally_required: if the request set it
      - ref: gen_ai.request.stream
        requirement_level:
          conditionally_required: If and only if the request is streaming. If unset, the request is assumed to be non-streaming.
      - ref: gen_ai.request.temperature
        requirement_level:
          conditionally_required: if the request set it
      - ref: gen_ai.request.top_k
        requirement_level:
          conditionally_required: if the request set it
      - ref: gen_ai.request.top_p
        requirement_level:
          conditionally_required: if the request set it
      - ref: gen_ai.response.finish_reasons
        requirement_level:
          conditionally_required: if the provider returned it
      - ref: gen_ai.response.id
        requirement_level:
          conditionally_required: if the provider returned it
      - ref: gen_ai.response.model
        requirement_level:
          conditionally_required: if the provider returned it
      - ref: gen_ai.system_instructions
        requirement_level: opt_in
      - ref: gen_ai.tool.definitions
        requirement_level: opt_in
      - ref: gen_ai.usage.cache_creation.input_tokens
        requirement_level:
          conditionally_required: if the provider reported cache usage
      - ref: gen_ai.usage.cache_read.input_tokens
        requirement_level:
          conditionally_required: if the provider reported cache usage
      - ref: gen_ai.usage.input_tokens
        requirement_level:
          conditionally_required: if the provider reported usage
      - ref: gen_ai.usage.output_tokens
        requirement_level:
          conditionally_required: if the provider reported usage
      - ref: gen_ai.usage.reasoning.output_tokens
        requirement_level:
          conditionally_required: when applicable
      - ref: network.peer.address
        requirement_level:
          conditionally_required: if the peer socket address was observed
      - ref: network.peer.port
        requirement_level:
          conditionally_required: if and only if `network.peer.address` is set.
      - ref: network.protocol.version
        requirement_level:
          conditionally_required: if the protocol version was observed on the wire
      - ref: openai.api.type
        requirement_level:
          conditionally_required: if the provider is OpenAI
      - ref: openai.request.service_tier
        requirement_level:
          conditionally_required: if the request includes a service_tier and the value is not 'auto'
      - ref: openai.response.service_tier
        requirement_level:
          conditionally_required: if the response was received and includes a service_tier
      - ref: openai.response.system_fingerprint
        requirement_level:
          conditionally_required: if the provider is OpenAI and returned it
      - ref: server.address
        requirement_level: required
      - ref: server.port
        requirement_level:
          conditionally_required: If `server.address` is set.
      - ref: service.peer.name
        requirement_level:
          conditionally_required: if the peer service name could be resolved
      - ref: span.metrics.skip
        requirement_level: opt_in

  - id: span.obi.gen_ai.embeddings.client
    type: span
    span_kind: client
    stability: development
    brief: OBI GenAI embeddings span.
    attributes:
      - ref: error.type
        requirement_level:
          conditionally_required: if the operation ended in an error
      - ref: gen_ai.embeddings.dimension.count
        requirement_level:
          conditionally_required: if the operation is an embeddings request
      - ref: gen_ai.operation.name
        requirement_level: required
      - ref: gen_ai.provider.name
        requirement_level: required
      - ref: gen_ai.request.embedding.input_count
        requirement_level:
          conditionally_required: if the operation is an embeddings request
      - ref: gen_ai.request.encoding_formats
        requirement_level:
          conditionally_required: if the request set it
      - ref: gen_ai.request.model
        requirement_level:
          conditionally_required: If available.
      - ref: gen_ai.response.model
        requirement_level:
          conditionally_required: if the provider returned it
      - ref: gen_ai.usage.input_tokens
        requirement_level:
          conditionally_required: if the provider reported usage
      - ref: network.peer.address
        requirement_level:
          conditionally_required: if the peer socket address was observed
      - ref: network.peer.port
        requirement_level:
          conditionally_required: if and only if `network.peer.address` is set.
      - ref: network.protocol.version
        requirement_level:
          conditionally_required: if the protocol version was observed on the wire
      - ref: server.address
        requirement_level: required
      - ref: server.port
        requirement_level:
          conditionally_required: If `server.address` is set.
      - ref: service.peer.name
        requirement_level:
          conditionally_required: if the peer service name could be resolved
      - ref: span.metrics.skip
        requirement_level: opt_in

  - id: span.obi.gen_ai.retrieval.client
    type: span
    span_kind: client
    stability: development
    brief: OBI GenAI retrieval and rerank span.
    attributes:
      - ref: error.type
        requirement_level:
          conditionally_required: if the operation ended in an error
      - ref: gen_ai.data_source.id
        requirement_level:
          conditionally_required: if applicable.
      - ref: gen_ai.operation.name
        requirement_level: required
      - ref: gen_ai.provider.name
        requirement_level: required
      - ref: gen_ai.request.model
        requirement_level:
          conditionally_required: If available.
      - ref: gen_ai.request.top_k
        requirement_level:
          conditionally_required: if the request set it
      - ref: gen_ai.rerank.top_n
        requirement_level:
          conditionally_required: if the operation is a rerank request
      - ref: network.peer.address
        requirement_level:
          conditionally_required: if the peer socket address was observed
      - ref: network.peer.port
        requirement_level:
          conditionally_required: if and only if `network.peer.address` is set.
      - ref: network.protocol.version
        requirement_level:
          conditionally_required: if the protocol version was observed on the wire
      - ref: server.address
        requirement_level: required
      - ref: server.port
        requirement_level:
          conditionally_required: If `server.address` is set.
      - ref: service.peer.name
        requirement_level:
          conditionally_required: if the peer service name could be resolved
      - ref: span.metrics.skip
        requirement_level: opt_in
