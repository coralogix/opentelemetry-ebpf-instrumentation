services:
  memcached:
    image: memcached:1.6.39-alpine@sha256:c8503d4491edd3110cc07d0465089d3a41cf1daf8645e71149e39a51835e92cd
    ports:
      - "11211:11211"

  testserver:
    build:
      context: ../../integration/components/pythonmemcached
      dockerfile: Dockerfile
    image: pythonmemcachedclient
    ports:
      - "8080:8080"
    depends_on:
      memcached:
        condition: service_started

  autoinstrumenter:
    build:
      context: ../../../..
      dockerfile: ./internal/test/integration/components/obi/Dockerfile
    command:
      - --config=/configs/instrumenter-config-traces.yml
    volumes:
      - ./configs:/configs
      - ./testoutput/run:/var/run/obi
      - ../../../../testoutput:/coverage
    privileged: true
    network_mode: "service:testserver"
    pid: "service:testserver"
    environment:
      GOCOVERDIR: "/coverage"
      OTEL_EBPF_TRACE_PRINTER: "text"
      OTEL_EBPF_OPEN_PORT: "8080"
      OTEL_EBPF_SERVICE_NAMESPACE: "integration-test"
      OTEL_EBPF_METRICS_INTERVAL: "10ms"
      OTEL_EBPF_OTLP_TRACES_BATCH_TIMEOUT: "1ms"
      OTEL_EBPF_BPF_BATCH_TIMEOUT: "10ms"
      OTEL_EBPF_LOG_LEVEL: "DEBUG"
      OTEL_EBPF_BPF_DEBUG: "true"
      OTEL_EBPF_SKIP_GO_SPECIFIC_TRACERS: "true"
      # Export through the weaver-tapping collector instead of straight to lgtm,
      # so weaver validates the emitted telemetry (see collector + weaver below).
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://collector:4318"
    depends_on:
      testserver:
        condition: service_started

  # Collector in front of the lgtm all-in-one: fans OBI's OTLP stream out to
  # both lgtm (for the existing Prometheus/Tempo checks) and weaver.
  collector:
    image: otel/opentelemetry-collector-contrib:0.155.0@sha256:4935caa35e9a4cb387e35732e8fb22b2b5759af8d12e7043357f03837f6e8df5
    volumes:
      - ./configs:/configs
    command: ["--config=/configs/otelcol-weaver.yaml"]
    depends_on:
      weaver:
        condition: service_healthy

  # Weaver semantic-convention live-check. The OATS harness stops it via the
  # admin port and reads its report after the per-test checks (observe mode).
  weaver:
    image: otel/weaver:v0.24.1@sha256:263964a7d444e77812f7a2d654e17683c4760a968c91278acdb7a44c20ccd572
    user: "0:0"
    working_dir: /obi-registry
    command:
      - registry
      - live-check
      - --registry
      - /obi-registry
      - --include-unreferenced
      - --inactivity-timeout
      - "300"
      - --admin-port
      - "4320"
      - --format
      - json
      - --diagnostic-format
      - json
      - --output
      - /tmp/weaver-out
    volumes:
      - ../../../schemas/obi:/obi-registry:ro
      - /tmp/obi-weaver-out:/tmp/weaver-out
    ports:
      - "4320:4320" # admin port (for /stop from the test host)
    healthcheck:
      test: ["CMD-SHELL", "wget --timeout=1 -q -O /dev/null http://127.0.0.1:4317/ 2>&1 | grep -qv refused"]
      interval: 5s
      timeout: 2s
      retries: 60
      start_period: 90s
