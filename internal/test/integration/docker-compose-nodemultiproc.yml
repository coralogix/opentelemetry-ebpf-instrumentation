version: "3.8"

services:
  nodeserver:
    build:
      context: ../../..
      dockerfile: internal/test/integration/components/nodemultiproc/Dockerfile
    image: nodemultiproc
    ports:
      - "5000:5000"
      - "5001:5001"
      - "5002:5002"
      - "5003:5003"
    environment:
      LOG_LEVEL: DEBUG
    depends_on:
      otelcol:
        condition: service_started
      jaeger:
        condition: service_started
