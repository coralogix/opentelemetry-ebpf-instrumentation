services:
  # Probe-discrimination stack for TestRustTokioProbeDiscrimination. Identical to
  # docker-compose-rust-tokio.yml except the Rust server/backend build profile is
  # selectable. Default is RELEASE — the shipping target — which requires the
  # raw::poll probe to fire on multi-thread workers and the blocking pool (the
  # v0.2.0 re-target). To exercise the debug path instead, set CARGO_PROFILE=debug
  # in the environment before `go test`.
  tokioserver:
    build:
      context: ../../..
      dockerfile: ./internal/test/integration/components/rusttokiotest/Dockerfile
      args:
        CARGO_PROFILE: ${CARGO_PROFILE:-release}
        RUSTFLAGS: ${RUSTFLAGS:-}
    image: hatest-rust-tokio-discrim
    ports:
      - "8092:8092" # server (the backend on 8093 stays internal)
    depends_on:
      jaeger:
        condition: service_started

  obi:
    build:
      context: ../../..
      dockerfile: ./internal/test/integration/components/obi/Dockerfile
    command:
      - --config=/configs/obi-config-rust-tokio.yml
    volumes:
      - ./configs/:/configs
      - ./system/sys/kernel/security:/sys/kernel/security
      - ../../../testoutput:/coverage
      - ../../../testoutput/run-rust-tokio:/var/run/obi
    image: hatest-obi
    privileged: true
    network_mode: "service:tokioserver"
    pid: "service:tokioserver"
    environment:
      GOCOVERDIR: "/coverage"
      OTEL_EBPF_DISCOVERY_POLL_INTERVAL: 500ms
      OTEL_EBPF_SERVICE_NAMESPACE: "integration-test"
      OTEL_EBPF_OTLP_TRACES_BATCH_TIMEOUT: "1ms"
      OTEL_EBPF_BPF_BATCH_TIMEOUT: "10ms"
      OTEL_EBPF_HOSTNAME: "obi"
    depends_on:
      tokioserver:
        condition: service_started

  jaeger:
    image: jaegertracing/all-in-one:1.60@sha256:4fd2d70fa347d6a47e79fcb06b1c177e6079f92cba88b083153d56263082135e
    ports:
      - "16686:16686"
      - "4317"
      - "4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - LOG_LEVEL=debug
