services:
  # Probe-discrimination stack for TestRustTokioProbeDiscrimination. Identical to
  # docker-compose-rust-tokio.yml except the Rust server/backend build profile is
  # selectable: release (default, what users ship) or debug, with CARGO_PROFILE=debug
  # set in the environment before `go test`.
  tokioserver:
    build:
      context: ../../..
      dockerfile: ./internal/test/integration/components/rusttokiotest/Dockerfile
      args:
        CARGO_PROFILE: ${CARGO_PROFILE:-release}
        RUSTFLAGS: ${RUSTFLAGS:-}
    image: hatest-rust-tokio-discrim
    ports:
      - "8092:8092" # server (the backends on 8093 and 8094 stay internal)
      - "8095:8095" # the server's std-thread sync listener
    depends_on:
      otelcol:
        condition: service_started

  obi:
    build:
      context: ../../..
      dockerfile: ./internal/test/integration/components/obi/Dockerfile
    command:
      - --config=/configs/obi-config-rust-tokio.yml
    volumes:
      - ./configs/:/configs
      - ./system/sys/kernel/security:/sys/kernel/security
      # sockops enrollment attaches at the host cgroup root; the FIONREAD compensation tracepoints need tracefs
      - /sys/kernel/tracing:/sys/kernel/tracing:ro
      - /sys/fs/cgroup:/sys/fs/cgroup
      - ../../../testoutput:/coverage
      - ../../../testoutput/run-rust-tokio:/var/run/obi
    image: hatest-obi
    privileged: true
    network_mode: "service:tokioserver"
    pid: "service:tokioserver"
    environment:
      GOCOVERDIR: "/coverage"
      OTEL_EBPF_DISCOVERY_POLL_INTERVAL: 500ms
      OTEL_EBPF_SERVICE_NAMESPACE: "integration-test"
      OTEL_EBPF_OTLP_TRACES_BATCH_TIMEOUT: "1ms"
      OTEL_EBPF_BPF_BATCH_TIMEOUT: "10ms"
      OTEL_EBPF_HOSTNAME: "obi"
    depends_on:
      tokioserver:
        condition: service_started

  otelcol:
    image: otel/opentelemetry-collector-contrib:0.164.0@sha256:340c9ca6a36617084c6661bdc4f0fe92b7cda5a805d61673ec8db375fddc522b
    container_name: otel-col
    deploy:
      resources:
        limits:
          memory: 125M
    restart: unless-stopped
    command: ["--config=/etc/otelcol-config/otelcol-config-weaver.yml"]
    volumes:
      - ./configs/:/etc/otelcol-config
    ports:
      - "4317"
      - "4318"
      - "9464"
      - "8888"
    depends_on:
      jaeger:
        condition: service_started
      weaver:
        condition: service_healthy

  weaver:
    extends:
      file: components/weaver/service.yml
      service: weaver
    volumes:
      - ../../../schemas/obi:/obi-registry:ro

  jaeger:
    image: jaegertracing/all-in-one:1.60@sha256:4fd2d70fa347d6a47e79fcb06b1c177e6079f92cba88b083153d56263082135e
    ports:
      - "16686:16686"
      - "4317"
      - "4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - LOG_LEVEL=debug
