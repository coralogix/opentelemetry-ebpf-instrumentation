services:
  testserver:
    build:
      context: ../../..
      dockerfile: ./internal/test/integration/components/go-runtime-metrics-server/Dockerfile
    image: hatest-testserver-go-runtime-metrics
    ports:
      - "${TEST_SERVICE_PORTS}"
    environment:
      - GOMEMLIMIT=512MiB
    depends_on:
      otelcol:
        condition: service_started

  obi:
    build:
      context: ../../..
      dockerfile: ./internal/test/integration/components/obi/Dockerfile
    volumes:
      - ./configs/:/configs
      - ./system/sys/kernel/security:/sys/kernel/security
      - ../../../testoutput:/coverage
      - ../../../testoutput/run-internal-metrics:/var/run/obi
      - /sys/kernel/tracing:/sys/kernel/tracing:rw
    image: hatest-obi
    privileged: true
    pid: "host"
    environment:
      OTEL_EBPF_CONFIG_PATH: /configs/obi-config-internal-metrics.yml
      GOCOVERDIR: "/coverage"
      OTEL_EBPF_DISCOVERY_POLL_INTERVAL: 500ms
      OTEL_EBPF_SERVICE_NAMESPACE: "integration-test"
      OTEL_EBPF_METRICS_INTERVAL: "10ms"
      OTEL_EBPF_INTERNAL_METRICS_INTERVAL: "10ms"
      OTEL_EBPF_LOG_LEVEL: "DEBUG"
      OTEL_EBPF_BPF_DEBUG: "TRUE"
      OTEL_EBPF_HOSTNAME: "obi"
      OTEL_EBPF_PROCESSES_INTERVAL: "100ms"
      OTEL_EBPF_OPEN_PORT: "8080"
      # application RED gives the eBPF probes something to instrument so the
      # obi.bpf.* self-metrics are populated; the internal (self) metrics
      # themselves are enabled via internal_metrics.exporter: otel in the config.
      OTEL_EBPF_METRICS_FEATURES: "application"
    depends_on:
      testserver:
        condition: service_started

  # OpenTelemetry Collector — weaver-tapped (metrics/weaver pipeline copies all
  # OTLP metrics, including the OBI internal metrics, to the weaver container).
  otelcol:
    image: otel/opentelemetry-collector-contrib:0.155.0@sha256:4935caa35e9a4cb387e35732e8fb22b2b5759af8d12e7043357f03837f6e8df5
    deploy:
      resources:
        limits:
          memory: 125M
    restart: unless-stopped
    command: ["--config=/etc/otelcol-config/otelcol-config-weaver-no-jaeger.yml"]
    volumes:
      - ./configs/:/etc/otelcol-config
    ports:
      - "4317" # OTLP over gRPC receiver
      - "4318:4318" # OTLP over HTTP receiver
    depends_on:
      weaver:
        condition: service_healthy

  weaver:
    extends:
      file: components/weaver/service.yml
      service: weaver
    volumes:
      - ../../../schemas/obi:/obi-registry:ro
