services:
  # Python gRPC server
  grpcsrv:
    build:
      context: ./components/pythongrpc
      dockerfile: Dockerfile_srv
    image: grpcsrv
    ports:
      - "50051:50051"
    depends_on:
      jaeger:
        condition: service_started

  # Python HTTP server that calls gRPC server (acts as gRPC client)
  testserver:
    build:
      context: ./components/pythongrpc
      dockerfile: Dockerfile
    image: grpclient
    ports:
      - "8080:8080"
    depends_on:
      grpcsrv:
        condition: service_started

  # eBPF auto instrumenter
  obi:
    build:
      context: ../../../..
      dockerfile: ./internal/test/integration/components/obi/Dockerfile
    command:
      - --config=/configs/obi-config-grpc-metadata-enrichment.yml
    volumes:
      - ./configs/:/configs
      - ../../../../testoutput:/coverage
      - ../../../../testoutput/run-grpc-metadata:/var/run/obi
    image: hatest-obi
    privileged: true
    pid: "host"
    environment:
      GOCOVERDIR: "/coverage"
      OTEL_EBPF_TRACE_PRINTER: "json"
      OTEL_EBPF_OPEN_PORT: 8080
      OTEL_EBPF_SKIP_GO_SPECIFIC_TRACERS: "true"
      OTEL_EBPF_SERVICE_NAMESPACE: "integration-test"
      OTEL_EBPF_METRICS_INTERVAL: "10ms"
      OTEL_EBPF_BPF_BATCH_TIMEOUT: "10ms"
      OTEL_EBPF_OTLP_TRACES_BATCH_TIMEOUT: "1ms"
      OTEL_EBPF_LOG_LEVEL: "DEBUG"
      OTEL_EBPF_BPF_DEBUG: "TRUE"
      OTEL_EBPF_DISCOVERY_POLL_INTERVAL: 500ms
      OTEL_EBPF_PROCESSES_INTERVAL: "100ms"
      OTEL_EBPF_HOSTNAME: "obi"
    depends_on:
      testserver:
        condition: service_started

  jaeger:
    image: jaegertracing/all-in-one:1.60@sha256:4fd2d70fa347d6a47e79fcb06b1c177e6079f92cba88b083153d56263082135e
    ports:
      - "16686:16686"
      - "4317"
      - "4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - LOG_LEVEL=debug
