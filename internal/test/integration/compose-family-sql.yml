# SQL suite topology: one instrumented test server talking to a database
# provided by a compose-frag-<store>.yml fragment.
# Parameters (interpolated from the harness environment):
#   TESTSERVER_CONTEXT     build context of the test server component
#   TESTSERVER_DOCKERFILE  dockerfile within that context
#   TESTSERVER_IMAGE       image tag for the built test server
#   TEST_SERVICE_PORTS     host:container port mapping of the test server
#   RUN_DIR                per-suite /var/run/obi directory under testoutput

services:
  testserver:
    build:
      context: ../../../internal/test/integration/components/${TESTSERVER_CONTEXT}/
      dockerfile: ${TESTSERVER_DOCKERFILE:-Dockerfile}
    image: ${TESTSERVER_IMAGE}
    ports:
      - "${TEST_SERVICE_PORTS}"
    depends_on:
      otelcol:
        condition: service_started
      sqlserver:
        condition: service_started

  otelcol:
    ports:
      - "4317" # OTLP over gRPC receiver
      - "4318:4318" # OTLP over HTTP receiver
      - "9464" # Prometheus exporter
      - "8888" # metrics endpoint
    depends_on:
      prometheus:
        condition: service_started
      jaeger:
        condition: service_started
      weaver:
        condition: service_healthy

  prometheus:
    ports:
      - "9090:9090"

  jaeger:
    ports:
      - "16686:16686" # Query frontend
      - "4317" # OTEL GRPC traces collector
      - "4318" # OTEL HTTP traces collector
