[package]
name = "server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13.0" }
# ureq: synchronous HTTP for the spawn_blocking endpoints (reqwest::blocking would
# panic inside spawn_blocking — it tries to start a nested Tokio runtime).
ureq = "2"
