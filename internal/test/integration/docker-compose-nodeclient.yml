version: "3.8"

services:
  nodeclient:
    build:
      context: ../../..
      dockerfile: internal/test/integration/components/nodeclient/Dockerfile
    image: hatest-nodeclient
    command:
      - node
      - ${NODE_APP}.js
    environment:
      LOG_LEVEL: DEBUG
    depends_on:
      otelcol:
        condition: service_started
