# Weaver semantic-convention validator for the Kubernetes / kind suites.
#
# Receives OTLP (metrics + traces) from the otelcol weaver tap
# (03-otelcol-weaver.yml + configs/otelcol-config-k8s-weaver.yml) and validates
# the emitted telemetry against the OBI schema registry under `schemas/obi/`,
# mounted read-only at /obi-registry via the kind `obi-registry` extraMount
# (see 00-kind*.yml). It writes its live-check report to
# /testoutput/weaver-out/live_check.json on the shared testoutput mount; the Go
# harness reads it from the host after POSTing /stop to the admin port (4320),
# which the kind config exposes on host port 32320.
#
# This is the in-cluster counterpart of components/weaver/service.yml.
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: obi-registry
spec:
  storageClassName: standard
  accessModes:
    - ReadOnlyMany
  capacity:
    storage: 10Mi
  hostPath:
    # Value set by the `obi-registry` extraMount in 00-kind*.yml
    path: /obi-registry
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: obi-registry
spec:
  volumeName: obi-registry
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 10Mi
---
apiVersion: v1
kind: Service
metadata:
  name: weaver
spec:
  selector:
    app: weaver
  ports:
    - port: 4317
      name: otlp-grpc
      targetPort: otlp-grpc
    - port: 4320
      name: admin
      targetPort: admin
---
apiVersion: v1
kind: Pod
metadata:
  name: weaver
  labels:
    app: weaver
spec:
  volumes:
    - name: obi-registry
      persistentVolumeClaim:
        claimName: obi-registry
    - name: testoutput
      persistentVolumeClaim:
        claimName: testoutput
  containers:
    - name: weaver
      image: otel/weaver:v0.24.1@sha256:263964a7d444e77812f7a2d654e17683c4760a968c91278acdb7a44c20ccd572
      workingDir: /obi-registry
      args:
        - registry
        - live-check
        - --registry
        - /obi-registry
        - --include-unreferenced
        - --inactivity-timeout
        - "300"
        - --admin-port
        - "4320"
        - --format
        - json
        - --diagnostic-format
        - json
        - --output
        - /testoutput/weaver-out
      volumeMounts:
        - mountPath: /obi-registry
          name: obi-registry
          readOnly: true
        - mountPath: /testoutput
          name: testoutput
      ports:
        - containerPort: 4317
          name: otlp-grpc
        - containerPort: 4320
          name: admin
          # exposed on the host via the kind extraPortMapping (host 32320)
          hostPort: 4320
