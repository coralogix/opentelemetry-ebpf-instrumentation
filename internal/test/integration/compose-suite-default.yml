services:
  testserver:
    build:
      context: ../../..
      dockerfile: internal/test/integration/components/testserver/Dockerfile${TESTSERVER_DOCKERFILE_SUFFIX}
    image: hatest-testserver
    ports:
      - "8080:8080"
      - "8081:8081"
      - "8082:8082"
      - "8083:8083"
      - "8087:8087"
      - "8088:8088"
      - "8383:8383"
      - "5051:5051"
      - "50051:50051"
    environment:
      LOG_LEVEL: DEBUG
      OTEL_RESOURCE_ATTRIBUTES: "service.version=1.0.0"

  pingclient:
    build:
      context: ../../..
      dockerfile: internal/test/integration/components/pingclient/Dockerfile${PINGSERVER_DOCKERFILE_SUFFIX}
    image: hatest-pingclient
    environment:
      LOG_LEVEL: DEBUG
