version: "3.8"

services:
  testserver:
    build:
      context: ../../..
      dockerfile: internal/test/integration/components/pythonselfserver/Dockerfile
    image: hatest-testserver-python
    ports:
      - 7771:7771
      - 7772:7772
      - 7773:7773
      - 7774:7774
      - 8999:8999
    environment:
      OTEL_SERVICE_NAME: "python-self"
    depends_on:
      otelcol:
        condition: service_started
