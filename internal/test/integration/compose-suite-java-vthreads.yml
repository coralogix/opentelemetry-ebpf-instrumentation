services:
  testserver:
    build:
      context: ../../..
      dockerfile: ./internal/test/integration/components/javatestserver/Dockerfile_jar
      args:
        JRE_IMAGE: eclipse-temurin:21-jre@sha256:010e0a06bd4e0184dec58626afb3ba727b42c56c91b977e2f0a9e0837e0fa3fb
    image: hatest-testserver-java-vt
    ports:
      - "8085:8085"
    environment:
      OTEL_SERVICE_NAME: testserver
      SPRING_THREADS_VIRTUAL_ENABLED: "true"

  downstream:
    build:
      context: ../../..
      dockerfile: ./internal/test/integration/components/testserver/Dockerfile
    image: hatest-testserver
    environment:
      STD_PORT: "8086"
      LOG_LEVEL: DEBUG

  obi:
    build:
      context: ../../..
      dockerfile: ./internal/test/integration/components/obi/Dockerfile-with-javaagent
    image: hatest-obi-b
  jaeger:
    ports:
      - "16686:16686" # Query frontend
      - "4317" # OTEL GRPC traces collector
      - "4318" # OTEL HTTP traces collector
