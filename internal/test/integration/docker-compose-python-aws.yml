version: "3.8"

services:
  localstack:
    image: localstack/localstack:4.14@sha256:3ebc37595918b8accb852f8048fef2aff047d465167edd655528065b07bc364a
    container_name: localstack
    ports:
      - "4566:4566"

  testserver:
    build:
      context: ../../../internal/test/integration/components/pythonawsclient/
      dockerfile: Dockerfile
    # TODO: use ghcr.io/open-telemetry/obi-testimg:python_aws_s3-0.0.1@sha256:6c113d604dc62f999425c70d82ce678f13498eef364f797bc18f2c3ed2988b15
    # That image is only being built for amd64:
    # docker inspect ghcr.io/open-telemetry/obi-testimg:python_aws_s3-0.0.1 --format '{{.Architecture}}' amd64
    # In tests we rely on commands to filter spans, if the binary changes (e.g. python3.12 -> python3.14) it's not updated right away in the image:
    # docker inspect ghcr.io/open-telemetry/obi-testimg:python_aws_s3-0.0.1 | jq '.[0].Config.Env.[3]' "PYTHON_VERSION=3.12.12"
    image: hatest-testserver-python-aws-client
    ports:
      - "${TEST_SERVICE_PORTS}"
    depends_on:
      localstack:
        condition: service_started
      otelcol:
        condition: service_started
