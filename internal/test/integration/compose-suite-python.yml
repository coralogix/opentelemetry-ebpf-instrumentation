services:
  testserver:
    build:
      context: ../../..
      dockerfile: internal/test/integration/components/pythonserver/Dockerfile${TESTSERVER_DOCKERFILE_SUFFIX}
    image: hatest-testserver-python
    ports:
      - "${TEST_SERVICE_PORTS}"
      - 8999:8999
    depends_on:
      otelcol:
        condition: service_started

  otelcol:
    command: ["--config=/etc/otelcol-config/otelcol-config-weaver-no-jaeger.yml"]
    ports:
      - "4317" # OTLP over gRPC receiver
      - "4318:4318" # OTLP over HTTP receiver
      - "9464" # Prometheus exporter
      - "8888" # metrics endpoint
    depends_on:
      prometheus:
        condition: service_started
      weaver:
        condition: service_healthy


  prometheus:
    ports:
      - "9090:9090"
