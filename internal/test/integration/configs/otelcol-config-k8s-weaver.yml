# otelcol config for the Kubernetes / kind suites with a weaver tap.
#
# Mirrors the base k8s `otelcol-config.yml` (OTLP receiver -> prometheus
# exporter, which the suites poll) and additionally fans every metric and
# trace batch out to the in-cluster weaver pod over OTLP gRPC so weaver can
# validate the emitted telemetry against the OBI semconv registry.
#
# The weaver tap pipelines have their own bounded queue with no retries and
# no block-on-overflow so a slow weaver never back-pressures the production
# prometheus path the tests depend on. Sample loss on the weaver side is
# acceptable — semconv validation only needs to *see* each unique advisory
# once, not aggregate every data point.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 100
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "http://*"
            - "https://*"
exporters:
  prometheus:
    endpoint: "otelcol:9464"
    resource_to_telemetry_conversion:
      enabled: true
    enable_open_metrics: true
  # Forward traces to jaeger so suites that route OBI traces through this
  # collector (instead of straight to jaeger) keep their jaeger-based trace
  # assertions working. Harmless for metrics-only suites (no traces flow).
  otlphttp/jaeger:
    endpoint: http://jaeger:4318
    tls:
      insecure: true
  otlp/weaver:
    endpoint: weaver:4317
    tls:
      insecure: true
    compression: none
    sending_queue:
      enabled: true
      queue_size: 500
      block_on_overflow: false
    retry_on_failure:
      enabled: false
service:
  pipelines:
    metrics:
      receivers: [otlp]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      exporters: [otlphttp/jaeger]
    metrics/weaver:
      receivers: [otlp]
      exporters: [otlp/weaver]
    traces/weaver:
      receivers: [otlp]
      exporters: [otlp/weaver]
