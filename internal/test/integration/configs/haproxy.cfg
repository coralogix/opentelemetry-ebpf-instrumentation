global
    daemon
    log stdout format raw local0 info
    maxconn 1024

defaults
    mode http
    log global
    option httplog
    option forwardfor
    option http-server-close
    timeout connect 5s
    timeout client  30s
    timeout server  30s

# Frontend -> tpclient-b (port 6001).
# The tpclient service in docker-compose is resolved as hostname "tpclient";
# all three tpclient-a/b/c listeners share the same container.
frontend fe_b
    bind *:7001
    default_backend be_b

backend be_b
    server tpclient_b tpclient:6001

# Frontend -> tpclient-c (port 6002).
frontend fe_c
    bind *:7002
    default_backend be_c

backend be_c
    server tpclient_c tpclient:6002
