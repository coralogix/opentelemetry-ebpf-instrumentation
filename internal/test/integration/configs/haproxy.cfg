global
    # No "daemon" — run in foreground so Docker tracks the process correctly.
    # The Alpine haproxy image's entrypoint handles this automatically, but
    # the RHEL9 UBI image runs haproxy directly.
    log stdout format raw local0 info
    maxconn 1024

defaults
    mode http
    log global
    option httplog
    option forwardfor
    # Aggressively reuse backend connections so the keepalive sub-test
    # actually exercises the warm-connection (idle-pool) code path in
    # HAProxy's backend state machine — that's what back_handle_st_rdy
    # is hooked to validate.
    http-reuse always
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    timeout http-keep-alive 30s

# Frontend -> tpclient-b (port 6001).
# The tpclient service in docker-compose is resolved as hostname "tpclient";
# all three tpclient-a/b/c listeners share the same container.
frontend fe_b
    bind *:7001
    default_backend be_b

backend be_b
    server tpclient_b tpclient:6001

# Frontend -> tpclient-c (port 6002).
frontend fe_c
    bind *:7002
    default_backend be_c

backend be_c
    server tpclient_c tpclient:6002
