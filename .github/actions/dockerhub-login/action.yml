name: Docker Hub login
description: |
  Log in to Docker Hub when a token is available, so image pulls are not
  subject to anonymous rate limits. Does nothing when the token is empty
  (e.g. fork PRs).

inputs:
  username:
    description: 'Docker Hub username.'
    required: false
    default: ''
  token:
    description: 'Docker Hub token. Login is skipped when empty.'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Log in to Docker Hub
      if: inputs.token != ''
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        username: ${{ inputs.username }}
        password: ${{ inputs.token }}
