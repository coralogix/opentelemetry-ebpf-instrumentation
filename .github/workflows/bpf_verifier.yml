name: BPF verifier
run-name: >-
  BPF verifier${{ inputs.pr_number && format(' · PR #{0}', inputs.pr_number) || '' }}${{ inputs.ref && format(' @ {0}', inputs.ref) || '' }}

# Not run per-PR: comment /verifier-tests on a PR to dispatch it (see
# slash_command_verifier_tests.yml). Still runs on push to main/release-*.
on:
  push:
    branches: [main, release-*]
  workflow_call:
    inputs:
      ref:
        description: "Git ref (commit, branch, or tag) to check out"
        required: false
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (commit, branch, or tag) to check out"
        required: false
        type: string
      pr_number:
        description: "PR number this dispatch is associated with (informational; surfaced in run-name)"
        required: false
        type: string

concurrency:
  group: bpf-verifier-${{ inputs.ref || github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate-bpf:
    name: Generate BPF
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: $/.github/actions/generate-bpf

  matrix:
    name: Build matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      kernels: ${{ steps.k.outputs.kernels }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - id: k
        run: |
          echo -n "kernels=" >> "$GITHUB_OUTPUT"
          bash scripts/kernel-matrix-json.sh --kind=verifier >> "$GITHUB_OUTPUT"

  test:
    name: Kernel ${{ matrix.kernel.id }}
    needs: [matrix, generate-bpf]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        kernel: ${{ fromJson(needs.matrix.outputs.kernels).include }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: $/.github/actions/free-disk
        with:
          docker-prune: 'false'

      - name: Download generated BPF files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bpf-generated-${{ github.run_id }}

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-utils qemu-system-x86

      - id: kernel
        uses: $/.github/actions/setup-lvh-kernel
        with:
          kernel-id: ${{ matrix.kernel.id }}
          lvh-tag: ${{ matrix.kernel.lvh_tag }}

      - name: Run BPF verifier tests in VM
        env:
          KERNEL: ${{ steps.kernel.outputs.kernel }}
          MODULES_DIR: ${{ steps.kernel.outputs.modules-dir }}
        run: |
          sudo make -C internal/test/vm \
            KERNEL="$KERNEL" \
            MODULES_DIR="$MODULES_DIR" \
            ARCH=amd64 \
            QEMU_SMP="$(nproc)" \
            TARGET_TEST=run-bpf-verifier-vm \
            && [ -f testoutput/success ]

  al2023:
    name: Kernel al2023-${{ matrix.nvr }}
    needs: generate-bpf
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - nvr: "6.1.172-216.329.amzn2023"
            pkg: "kernel"
          - nvr: "6.12.88-119.157.amzn2023"
            pkg: "kernel6.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: $/.github/actions/free-disk
        with:
          docker-prune: 'false'

      - uses: $/.github/actions/setup-go-env
        with:
          cache-profile: verifier

      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-utils qemu-system-x86 cpio

      - name: Run BPF verifier on AL2023 kernel
        env:
          GOTOOLCHAIN: auto
        run: sudo -E bash internal/test/vm/lvh/al2023/run.sh "${{ matrix.nvr }}" "${{ matrix.pkg }}"

  host-arm64:
    name: Host kernel (arm64)
    # Runs verifier suite directly on the runner's own kernel — no VM, no
    # kernel matrix. Cheapest way to keep arm64 in the PR-blocking set.
    needs: generate-bpf
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: $/.github/actions/setup-go-env
        with:
          cache-profile: verifier

      - name: Run BPF verifier tests (host kernel)
        run: go test -exec=sudo -count=1 -timeout=55m -parallel=8 -tags=bpf_verifier_tests ./pkg/internal/ebpf/verifier/...
