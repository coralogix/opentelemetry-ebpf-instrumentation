name: cx-build-push-ecr

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (commit, branch, or tag) to build and push"
        required: false
        type: string
      pr_number:
        description: "PR number this dispatch is associated with (informational)"
        required: false
        type: string

permissions:
  contents: read

env:
  AWS_REGION: eu-west-1
  AWS_ACCOUNT_ID: 897729105761 # tacotaco-research
  AWS_ROLE_TO_ASSUME: arn:aws:iam::897729105761:role/AnemiaAgentRole
  IMAGE: 897729105761.dkr.ecr.eu-west-1.amazonaws.com/obi-internal

jobs:
  build:
    # native runner per arch, no QEMU
    if: github.repository == 'coralogix/opentelemetry-ebpf-instrumentation'
    permissions:
      contents: read
      id-token: write # OIDC for configure-aws-credentials
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

      - name: Create ECR repository
        run: |
          aws ecr create-repository --repository-name "obi-internal" --region "$AWS_REGION" || echo "Repository obi-internal already exists."

      - name: Set up buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          driver: docker-container

      - name: Set Git Commit Hash
        run: echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Build and push ${{ matrix.arch }}
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          platforms: ${{ matrix.platform }}
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ env.COMMIT_HASH }}-${{ matrix.arch }}
          cache-from: type=gha,scope=cx-${{ matrix.arch }}
          cache-to: type=gha,scope=cx-${{ matrix.arch }},mode=max

  merge-manifest:
    if: github.repository == 'coralogix/opentelemetry-ebpf-instrumentation'
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    needs:
      - build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

      - name: Set Git Commit Hash
        run: echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Create multi-arch manifest
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:$COMMIT_HASH" \
            "$IMAGE:$COMMIT_HASH-amd64" \
            "$IMAGE:$COMMIT_HASH-arm64"

      - name: Comment image on PR
        if: inputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          gh api -X POST "repos/${OWNER}/${REPO}/issues/${PR_NUMBER}/comments" \
            -f body="Pushed \`$IMAGE:$COMMIT_HASH\` (amd64+arm64)" >/dev/null
