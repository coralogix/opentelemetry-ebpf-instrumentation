name: PR checks

on:
  push:
    branches: [main, release-*]
  pull_request:
    branches: [main, release-*]
    paths:
      - ".github/workflows/pull_request.yml"
      - ".github/actions/generate-bpf/**"
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "bpf/**"
      - "cmd/**"
      - "collector/**"
      - "configs/**"
      - "devdocs/config/version-2.0/**"
      - "internal/**"
      - "pkg/**"
      - "schemas/**"
      - "scripts/**"
      - "Makefile"
      - "Dockerfile"
      - "**/*Dockerfile*"
  workflow_call:
    inputs:
      ref:
        description: "Git ref (commit, branch, or tag) to check out"
        required: false
        type: string

concurrency:
  group: pr-checks-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate-bpf:
    name: Generate BPF
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: $/.github/actions/generate-bpf

  checks:
    name: Generated files and repo hygiene
    needs: generate-bpf
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: $/.github/actions/setup-go-env
        with:
          cache-profile: checks
          prereqs: 'true'

      - name: Run checks
        env:
          SKIP_BPF_GENERATE: "1"
        run: make go-mod-tidy license-header-check notices-update check-go-mod check-ebpf-ver-synced check-config-schema check-config-v2-artifacts check-clean-work-tree

  clang-format:
    name: Clang format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check clang-format
        run: |
          files=$( \
            git diff --name-status origin/main...HEAD \
            | awk '$1 != "D" && $2 !~ /^(NOTICES|bpf\/bpfcore)\// && /\.(c|cpp|h)$/ { print ($3 != "" ? $3 : $2) }' \
          )
          if [ -z "$files" ]; then
            echo "No C/C++ files modified."
            exit 0
          fi
          make docker-clang-format CLANG_FORMAT_FILES="$(echo $files)"
          if ! git diff --exit-code $files; then
            echo "Error: Some files are not formatted correctly. Run make docker-clang-format CLANG_FORMAT_FILES=\"$(echo $files)\"."
            exit 1
          fi

  clang-tidy:
    name: Clang tidy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Run clang-tidy
        run: make docker-clang-tidy

  collector-cross-compile:
    name: "Collector cross-compile (${{ matrix.goos }}/${{ matrix.goarch }})"
    needs: generate-bpf
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Supported platforms (full OBI eBPF support)
          - { goos: linux,   goarch: amd64  }
          - { goos: linux,   goarch: arm64  }
          # Unsupported platforms (factory stubs — must compile, return errUnsupportedPlatform at runtime)
          - { goos: linux,   goarch: ppc64le }
          - { goos: linux,   goarch: s390x   }
          - { goos: linux,   goarch: "386"   }
          - { goos: windows, goarch: amd64  }
          - { goos: windows, goarch: arm64  }
          - { goos: darwin,  goarch: amd64  }
          - { goos: darwin,  goarch: arm64  }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: $/.github/actions/setup-go-env
        with:
          cache-profile: cross-${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Build collector package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./collector/...

  otel-collector-example:
    name: OTel Collector example (ocb build)
    needs: generate-bpf
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: $/.github/actions/setup-go-env
        with:
          cache-profile: otelcol-example

      - name: Resolve ocb version from go.mod
        id: ocb
        shell: bash
        run: |
          # Pin ocb to the Collector release line OBI itself depends on, so the
          # example is always built against a compatible builder (see #2264).
          version=$(grep -E '^[[:space:]]*go\.opentelemetry\.io/collector v[0-9]' go.mod | awk '{print $2}')
          if [ -z "$version" ]; then
            echo "could not determine collector version from go.mod" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install ocb
        env:
          OCB_VERSION: ${{ steps.ocb.outputs.version }}
        run: go install go.opentelemetry.io/collector/cmd/builder@"${OCB_VERSION}"

      - name: Build collector distribution
        working-directory: examples/otel-collector
        run: "$(go env GOPATH)/bin/builder --config ./builder-config.yaml"

      - name: Validate Config v2 collector configuration
        working-directory: examples/otel-collector
        run: ./otelcol-dev/otelcol-dev validate --config ./config.yaml

      - name: Smoke test Config v2 collector receiver
        working-directory: examples/otel-collector
        run: sudo ./smoke-test.sh
