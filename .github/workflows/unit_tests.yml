name: Unit tests

on:
  push:
    branches: [main, release-*]
  pull_request:
    branches: [main, release-*]
    paths:
      - ".github/workflows/unit_tests.yml"
      - ".github/actions/setup-go-env/**"
      - ".github/actions/generate-bpf/**"
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "bpf/**"
      - "cmd/**"
      - "configs/**"
      - "internal/**"
      - "pkg/**"
      - "scripts/**"
      - "Makefile"
  workflow_call:
    inputs:
      ref:
        description: "Git ref (commit, branch, or tag) to check out"
        required: false
        type: string

concurrency:
  group: pr-unit-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate-bpf:
    name: Generate BPF
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: $/.github/actions/generate-bpf

  matrix:
    name: Build test matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Test flaky-run supervisor
        run: make test-rerun-flaky

      - name: Build test matrix
        id: build-matrix
        env:
          PARTITIONS: 3
        run: |
          echo -n "matrix=" >> "$GITHUB_OUTPUT"
          make unit-test-matrix-json >> "$GITHUB_OUTPUT"

  test:
    name: "Unit tests #${{ matrix.shard.id }} (${{ matrix.platform.arch }})"
    needs: [matrix, generate-bpf]
    permissions:
      checks: write
      pull-requests: write
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
        shard: ${{ fromJson(needs.matrix.outputs.matrix).include }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: $/.github/actions/setup-go-env
        with:
          cache-profile: unit-race-${{ matrix.shard.id }}
          prereqs: 'true'

      - name: Run unit tests
        env:
          MATRIX_ID: ${{ matrix.shard.id }}
          MATRIX_PACKAGES: ${{ matrix.shard.packages }}
        run: make run-unit-test-shard cov-exclude-generated SHARD_ID="${MATRIX_ID}" UNIT_TEST_PACKAGES="${MATRIX_PACKAGES}"

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-reports-${{ matrix.shard.id }}-${{ matrix.platform.arch }}-${{ github.run_number }}
          path: testoutput/unit-test-shard-*.log
          retention-days: 5

      - name: Report coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./testoutput/cover.txt
          flags: unittests
          name: unit-coverage-${{ matrix.shard.id }}-${{ matrix.platform.arch }}-${{ github.run_number }}
