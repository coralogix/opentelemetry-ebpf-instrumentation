name: Weaver coverage (combined)

# Aggregates weaver live-check coverage across every weaver-wired suite. The
# integration matrix, OATS, and the Kubernetes suite each run as an independent
# workflow and upload their per-suite reports as `weaver-reports-*` artifacts.
# This workflow fires when any of them completes and, for that commit, gathers
# the `weaver-reports-*` artifacts from all of their completed runs, unions them
# via `make weaver-coverage`, and posts the covered/total summary plus the
# never-observed metrics and attributes as a PR comment.
#
# It fires once per contributing workflow, so the comment is upserted (matched
# by a hidden marker): the run after the last suite finishes carries the
# complete number. Suites that have not finished yet for the commit simply
# contribute no reports that round.

on:
  workflow_run:
    workflows:
      - "Integration tests"
      - "OATS tests"
      - "Integration tests K8S"
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  # Serialize the firings for one commit so the upserted comment is not raced.
  group: weaver-coverage-combined-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  aggregate:
    name: Aggregate weaver telemetry coverage (all suites)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 # zizmor: ignore[cache-poisoning] go.sum verifies module integrity
        with:
          go-version-file: "go.mod"

      - name: Collect weaver reports from all suites for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p all-weaver-reports
          run_ids=$(gh api --paginate \
            "repos/${REPO}/actions/runs?head_sha=${HEAD_SHA}&per_page=100" \
            --jq '.workflow_runs[]
                  | select(.name == "Integration tests" or .name == "OATS tests" or .name == "Integration tests K8S")
                  | select(.status == "completed")
                  | .id' | sort -u)
          echo "contributing completed runs: ${run_ids:-none}"
          for id in $run_ids; do
            gh run download "$id" --dir all-weaver-reports --pattern 'weaver-reports-*' 2>/dev/null || true
          done
          count=$(find all-weaver-reports -name 'weaver-report-*.json' | wc -l | tr -d ' ')
          echo "collected ${count} weaver report file(s)"
          echo "REPORT_COUNT=${count}" >> "$GITHUB_ENV"

      - name: Aggregate coverage
        if: env.REPORT_COUNT != '0'
        run: make weaver-coverage WEAVER_REPORTS_DIR=all-weaver-reports WEAVER_COVERAGE_OUT=weaver-coverage-out

      - name: Upload coverage summary
        if: env.REPORT_COUNT != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: weaver-coverage-combined-${{ github.event.workflow_run.id }}
          path: weaver-coverage-out/
          retention-days: 30

      - name: Post coverage to the PR
        if: env.REPORT_COUNT != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          marker='<!-- weaver-coverage-combined -->'
          pr=$(gh api "repos/${REPO}/commits/${HEAD_SHA}/pulls" \
                 --jq '.[0].number' 2>/dev/null || true)
          if [ -z "$pr" ] || [ "$pr" = "null" ]; then
            echo "no open PR for ${HEAD_SHA}; skipping comment"
            exit 0
          fi
          { printf '%s\n\n' "$marker"; cat weaver-coverage-out/coverage.md; } > comment.md
          jq -n --rawfile body comment.md '{body: $body}' > payload.json
          cid=$(gh api --paginate "repos/${REPO}/issues/${pr}/comments" \
                  --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -1)
          if [ -n "$cid" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${cid}" --input payload.json >/dev/null
            echo "updated PR #${pr} comment ${cid}"
          else
            gh api -X POST "repos/${REPO}/issues/${pr}/comments" --input payload.json >/dev/null
            echo "created comment on PR #${pr}"
          fi
