name: Lint

on:
  push:
    branches: [main, release-*]
  pull_request:
    branches: [main, release-*]
    paths:
      - ".github/workflows/lint.yml"
      - "Dockerfile"
      - "**/*Dockerfile*"
      - "Makefile"
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "bpf/**"
      - "cmd/**"
      - "devdocs/dependency-integrity-policy.md"
      - "devdocs/README.md"
      - "scripts/lint-dependency-policy.sh"
      - "configs/**"
      - "internal/**"
      - "pkg/**"
      - "schemas/**"
      - "scripts/**"
  workflow_call:
    inputs:
      ref:
        description: "Git ref (commit, branch, or tag) to check out"
        required: false
        type: string

concurrency:
  group: pr-lint-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # macOS runners lack Docker so they can't run `make docker-generate`. Run it
  # once on Linux, share artifact with all lint jobs.
  generate-bpf:
    name: Generate BPF
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: $/.github/actions/generate-bpf

  lint-linux:
    name: Lint on linux (${{ matrix.platform.arch }})
    needs: generate-bpf
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: $/.github/actions/setup-go-env
        with:
          cache-profile: lint

      - name: Lint
        run: make lint

      # Schema lint is arch-neutral (weaver YAML/JSON). Keep it on amd64 only.
      - name: Lint OBI semantic-convention registry
        if: matrix.platform.arch == 'amd64'
        run: make lint-schema

      - name: Test OBI semantic-convention registry provenance
        if: matrix.platform.arch == 'amd64'
        run: make test-schema

      - name: Check published OBI telemetry schema files
        if: matrix.platform.arch == 'amd64'
        run: make check-schema-files

      - name: Check generated OBI telemetry reference docs
        if: matrix.platform.arch == 'amd64'
        run: make check-schema-docs

  lint-darwin:
    name: Lint on macOS
    needs: generate-bpf
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: $/.github/actions/setup-go-env
        with:
          cache-profile: lint

      - name: Lint
        run: make lint
