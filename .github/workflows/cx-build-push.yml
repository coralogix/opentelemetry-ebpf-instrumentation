name: CX build and push

on:
  push:
    branches: [ 'main', 'internal/build-push-job', 'matt/internal-img-rm-pinned' ]
  pull_request:
    branches: [ 'internal/build-push-job' ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.repository == 'coralogix/opentelemetry-ebpf-instrumentation'
    permissions:
      id-token: write
      packages: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Login to jfrog
        uses: docker/login-action@v3
        with:
          registry: cgx.jfrog.io
          username: ${{ secrets.JFROG_USER }}
          password: ${{ secrets.JFROG_PASSWORD }}

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container  # NOTE: 'docker-container' driver is required for multi-platform support

      - name: Cache images
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Set Git Commit Hash
        run: echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            cgx.jfrog.io/coralogix-docker-images/obi-internal:${{ env.COMMIT_HASH }}
            cgx.jfrog.io/coralogix-docker-images/obi-internal:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,new=true
